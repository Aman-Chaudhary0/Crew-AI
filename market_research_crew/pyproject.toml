[project]
name = "market_research_crew"
version = "0.1.0"
description = "market-research-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.26,<2.0.0",
    "selenium>=4.51.0",
    "webdriver-manager>=4.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "9fc627db-2788-4130-bb0e-d6ef7a4b8b60"
